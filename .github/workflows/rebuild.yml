name: daily rebuild

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild even if upstream is unchanged
        type: boolean
        required: false
        default: false

concurrency:
  group: rebuild
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      fingerprint: ${{ steps.state.outputs.fingerprint }}
    permissions:
      actions: read
    steps:
      - name: Compute upstream state
        id: state
        run: |
          set -euo pipefail
          ollama=$(docker manifest inspect ollama/ollama:latest | sha256sum | awk '{print $1}')
          arch=$(docker manifest inspect archlinux:latest | sha256sum | awk '{print $1}')
          core=$(curl -fsSL https://geo.mirror.pkgbuild.com/core/os/x86_64/core.db | sha256sum | awk '{print $1}')
          extra=$(curl -fsSL https://geo.mirror.pkgbuild.com/extra/os/x86_64/extra.db | sha256sum | awk '{print $1}')
          fingerprint=$(printf 'ollama=%s\narch=%s\ncore=%s\nextra=%s\nrepo=%s\n' \
            "$ollama" "$arch" "$core" "$extra" "${{ github.sha }}" | sha256sum | awk '{print $1}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore state cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/rebuild-state
          key: rebuild-${{ steps.state.outputs.fingerprint }}

      - name: Decide whether to rebuild
        id: decide
        run: |
          set -euo pipefail
          changed=false
          if [[ "${{ github.event_name }}" == "push" ]]; then
            changed=true
          elif [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            changed=true
          elif [[ "${{ steps.restore.outputs.cache-hit }}" != "true" ]]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Date tag
        id: date
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          pull: true
          no-cache: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
          build-args: |
            SOURCE_REPO=https://github.com/${{ github.repository }}
            REVISION=${{ github.sha }}

      - name: Stamp state for cache
        run: |
          mkdir -p /tmp/rebuild-state
          echo "${{ needs.check.outputs.fingerprint }}" > /tmp/rebuild-state/fingerprint

      - name: Save state cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/rebuild-state
          key: rebuild-${{ needs.check.outputs.fingerprint }}

      - name: Prune old caches
        uses: actions/github-script@v7
        env:
          FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
        with:
          script: |
            const keep = `rebuild-${process.env.FINGERPRINT}`;
            const { owner, repo } = context.repo;
            const { data } = await github.request(
              'GET /repos/{owner}/{repo}/actions/caches',
              { owner, repo, per_page: 100 }
            );
            for (const cache of data.actions_caches) {
              if (cache.key.startsWith('rebuild-') && cache.key !== keep) {
                await github.request(
                  'DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}',
                  { owner, repo, cache_id: cache.id }
                );
                core.info(`deleted cache ${cache.id} (${cache.key})`);
              }
            }

  test:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
      MODEL: llama3.2:1b-instruct-q2_K
      OLLAMA_DIR: /tmp/ollama-models
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ollama-models
          key: ollama-models

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run test
        run: ./test.sh

      - name: Save model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/ollama-models
          key: ollama-models
